<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Asteroid 3D Tracker</title>
    <style>
        body { margin: 0; background: #05060f; color: #e0e6f0; font-family: Arial, sans-serif; overflow: hidden; }
        #ui {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(17,24,39,0.85); padding: 12px 16px; border-radius: 8px;
        }
        input[type="date"] { padding: 5px; margin-right: 6px; border-radius: 4px; border: none; }
        button { padding: 7px 14px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #status { margin-top: 6px; font-size: 13px; color: #9ca3af; }
        #panel {
            position: absolute; bottom: 15px; left: 15px; right: 15px; z-index: 10;
            background: rgba(17,24,39,0.9); padding: 12px 16px; border-radius: 8px;
            font-size: 14px; max-height: 160px; overflow-y: auto; display: none;
        }
        .hazardous { color: #f87171; font-weight: bold; }
        .safe { color: #4ade80; }
    </style>
</head>
<body>
    <div id="ui">
        <label>Start: <input type="date" id="startDate" value="2026-09-18"></label>
        <label>End: <input type="date" id="endDate" value="2026-09-20"></label>
        <button onclick="loadAsteroids()">Scan the Sky</button>
        <div id="status">Loading...</div>
    </div>

    <div id="panel"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 40, 140);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // lighting
        scene.add(new THREE.AmbientLight(0x404040, 2));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2);
        sunLight.position.set(100, 50, 100);
        scene.add(sunLight);

        // Earth - textured sphere (using a public Three.js example texture)
        const earthTexture = new THREE.TextureLoader().load(
            "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
        );
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(10, 64, 64),
            new THREE.MeshStandardMaterial({ map: earthTexture })
        );
        scene.add(earth);

        // ISS - loaded from your local model, orbiting close to Earth.
        // We use a wrapper group: the group's position handles the orbit motion,
        // while the model inside it gets shifted to sit centered within the group.
        let issGroup = new THREE.Group();
        scene.add(issGroup);
        const issOrbit = { radius: 16, angle: 0, speed: 0.006, tilt: 0.3 };

        new GLTFLoader().load(
            "/static/models/ISS_Model.glb",
            (gltf) => {
                const iss = gltf.scene;

                // measure the model's real size, since .glb files can be exported
                // at wildly different scales (meters vs centimeters vs arbitrary units)
                const box = new THREE.Box3().setFromObject(iss);
                const size = new THREE.Vector3();
                box.getSize(size);
                const maxDimension = Math.max(size.x, size.y, size.z);
                console.log("ISS raw size:", size, "max dimension:", maxDimension);

                // scale it so its largest dimension becomes about 4 units - tweak this
                // number if it still looks too big or too small
                const targetSize = 4;
                const scaleFactor = targetSize / maxDimension;
                iss.scale.setScalar(scaleFactor);

                // re-center the model on its own origin, in case its pivot point
                // isn't at its geometric center (common with exported models)
                const center = new THREE.Vector3();
                box.getCenter(center);
                iss.position.sub(center.multiplyScalar(scaleFactor));

                issGroup.add(iss); // the group will be moved each frame; iss stays centered inside it
                console.log("ISS added to scene", iss);
            },
            undefined,
            (error) => console.error("Could not load ISS model:", error)
        );

        // starfield background
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 1000;
        starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
        scene.add(stars);

        // rocky surface texture, reused for every asteroid (stand-in for real asteroid textures)
        const rockTexture = new THREE.TextureLoader().load(
            "https://threejs.org/examples/textures/planets/moon_1024.jpg"
        );

        // makes a lumpy, irregular rock shape instead of a perfect sphere, so asteroids
        // don't all look like plain balls. Each call produces a slightly different shape.
        function makeAsteroidGeometry(size) {
            const geometry = new THREE.IcosahedronGeometry(size, 1);
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vertex = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
                const bump = 1 + (Math.random() - 0.5) * 0.4; // +/-20% surface jitter
                vertex.multiplyScalar(bump);
                pos.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            geometry.computeVertexNormals();
            return geometry;
        }

        // asteroid meshes get stored here once loaded
        let asteroidMeshes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function clearAsteroids() {
            for (const m of asteroidMeshes) scene.remove(m);
            asteroidMeshes = [];
        }

        function buildAsteroids(data) {
            clearAsteroids();

            const distances = data.map(a => a.miss_distance_km);
            const minD = Math.min(...distances);
            const maxD = Math.max(...distances);
            const diameters = data.map(a => a.diameter_m);
            const maxDia = Math.max(...diameters);

            data.forEach((a) => {
                const orbitRadius = 20 + ((a.miss_distance_km - minD) / (maxD - minD || 1)) * 60;
                const size = 0.5 + (a.diameter_m / maxDia) * 3;
                const color = a.hazardous ? 0xf87171 : 0x4ade80;

                const mesh = new THREE.Mesh(
                    makeAsteroidGeometry(size),
                    new THREE.MeshStandardMaterial({
                        map: rockTexture,
                        emissive: color,
                        emissiveIntensity: 0.35 // hazard color still glows through the rock texture
                    })
                );

                const angle = Math.random() * Math.PI * 2;
                const tilt = (Math.random() - 0.5) * 0.6; // slight vertical variation
                mesh.position.set(
                    Math.cos(angle) * orbitRadius,
                    tilt * orbitRadius,
                    Math.sin(angle) * orbitRadius
                );



                mesh.userData = {
                    ...a,
                    orbitRadius,
                    angle,
                    tilt,
                    speed: 0.001 + (a.speed_kph / 150000) * 0.01,
                    spin: {
                        x: (Math.random() - 0.5) * 0.02,
                        y: (Math.random() - 0.5) * 0.02
                    }
                };

                scene.add(mesh);
                asteroidMeshes.push(mesh);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.0015;

            for (const m of asteroidMeshes) {
                const d = m.userData;
                d.angle += d.speed;
                m.position.set(
                    Math.cos(d.angle) * d.orbitRadius,
                    d.tilt * d.orbitRadius,
                    Math.sin(d.angle) * d.orbitRadius
                );
                m.rotation.x += d.spin.x;
                m.rotation.y += d.spin.y;
            }

            if (issGroup.children.length > 0) {
                issOrbit.angle += issOrbit.speed;
                issGroup.position.set(
                    Math.cos(issOrbit.angle) * issOrbit.radius,
                    issOrbit.tilt * issOrbit.radius,
                    Math.sin(issOrbit.angle) * issOrbit.radius
                );
                issGroup.rotation.y += 0.01; // slow spin so it doesn't look frozen
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // click-to-inspect
        renderer.domElement.addEventListener("click", (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(asteroidMeshes);

            const panel = document.getElementById("panel");
            if (hits.length > 0) {
                const a = hits[0].object.userData;
                panel.style.display = "block";
                panel.innerHTML = `
                    <strong>${a.name}</strong> (${a.date})<br>
                    Diameter: ${a.diameter_m.toFixed(1)} m &nbsp;|&nbsp;
                    Speed: ${a.speed_kph.toLocaleString()} km/h &nbsp;|&nbsp;
                    Miss distance: ${a.miss_distance_km.toLocaleString()} km<br>
                    Hazardous: <span class="${a.hazardous ? 'hazardous' : 'safe'}">${a.hazardous ? "YES" : "No"}</span><br>
                    <em>Estimated physics (from our C calculations, density-assumed):</em><br>
                    Mass: ${a.mass_kg_est.toExponential(2)} kg &nbsp;|&nbsp;
                    Kinetic energy: ${a.kinetic_energy_j_est.toExponential(2)} J<br>
                    Gravitational pull on Earth: ${a.gravitational_force_n_est.toExponential(2)} N &nbsp;|&nbsp;
                    TNT equivalent: ${a.tnt_equivalent_megatons_est.toFixed(4)} megatons
                `;
            }
        });

        // expose loadAsteroids globally so the button's onclick can reach it
        window.loadAsteroids = async function () {
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const status = document.getElementById("status");
            status.innerText = "Fetching + calculating...";

            try {
                const response = await fetch("/get_asteroids", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ start_date: startDate, end_date: endDate })
                });
                const data = await response.json();

                if (data.error) {
                    status.innerText = "Error: " + data.error;
                    return;
                }

                status.innerText = `Tracking ${data.asteroids.length} objects.`;
                buildAsteroids(data.asteroids);
            } catch (err) {
                status.innerText = "Something went wrong: " + err;
            }
        };

        loadAsteroids();
    </script>
</body>
</html>
