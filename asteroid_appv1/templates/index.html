<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Asteroid Space View</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #05060f;
            color: #e0e6f0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 20px 0 5px; text-align: center; }
        .controls { margin-bottom: 10px; }
        input[type="date"] { padding: 6px; margin-right: 8px; border-radius: 4px; border: none; }
        button {
            padding: 8px 16px; background: #3b82f6; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #2563eb; }
        #status { margin: 6px 0; color: #9ca3af; font-size: 14px; }
        canvas { border: 1px solid #1e293b; border-radius: 8px; background: radial-gradient(circle, #0b0f1e 0%, #05060f 100%); }
        #panel {
            width: 900px; max-width: 95vw; margin-top: 15px; padding: 12px 16px;
            background: #111827; border-radius: 8px; min-height: 40px; font-size: 14px;
        }
        .hazardous { color: #f87171; font-weight: bold; }
        .safe { color: #4ade80; }
        a { color: #60a5fa; }
        .legend { display: flex; gap: 20px; margin-top: 8px; font-size: 13px; color: #9ca3af; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>☄️ Near-Earth Asteroid Space View</h1>

    <div class="controls">
        <label>Start: <input type="date" id="startDate" value="2026-09-18"></label>
        <label>End: <input type="date" id="endDate" value="2026-09-22"></label>
        <button onclick="fetchAsteroids()">Scan the Sky</button>
    </div>
    <div id="status">Loading...</div>

    <canvas id="space" width="900" height="600"></canvas>
    <div class="legend">
        <span><span class="dot" style="background:#4ade80;"></span>Safe</span>
        <span><span class="dot" style="background:#f87171;"></span>Potentially Hazardous</span>
        <span>Dot size = relative diameter</span>
        <span>Click a dot for details</span>
    </div>

    <div id="panel">Click any asteroid to see its details here.</div>

    <script>
        const canvas = document.getElementById("space");
        const ctx = canvas.getContext("2d");
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let asteroids = [];   // raw data from server
        let bodies = [];      // objects with animation state
        let animId = null;

        async function fetchAsteroids() {
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const status = document.getElementById("status");

            status.innerText = "Contacting NASA...";

            try {
                const response = await fetch("/get_asteroids", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ start_date: startDate, end_date: endDate })
                });
                const data = await response.json();

                if (data.error) {
                    status.innerText = "Error: " + data.error;
                    return;
                }

                asteroids = data.asteroids;
                status.innerText = `Tracking ${asteroids.length} objects between ${startDate} and ${endDate}.`;
                setupBodies();
            } catch (err) {
                status.innerText = "Something went wrong: " + err;
            }
        }

        function setupBodies() {
            // scale miss distance (km) down into a screen radius band, closest = smallest orbit
            const distances = asteroids.map(a => a.miss_distance_km);
            const minD = Math.min(...distances);
            const maxD = Math.max(...distances);

            const diameters = asteroids.map(a => a.diameter_m);
            const maxDia = Math.max(...diameters);

            bodies = asteroids.map((a, i) => {
                const orbitRadius = 60 + ((a.miss_distance_km - minD) / (maxD - minD || 1)) * 260;
                const dotSize = 3 + (a.diameter_m / maxDia) * 14;
                const speedFactor = 0.002 + (a.speed_kph / 150000) * 0.01;
                return {
                    ...a,
                    orbitRadius,
                    dotSize,
                    angle: Math.random() * Math.PI * 2,
                    speed: speedFactor,
                    color: a.hazardous ? "#f87171" : "#4ade80"
                };
            });

            if (animId) cancelAnimationFrame(animId);
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // draw Earth
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.fillStyle = "#3b82f6";
            ctx.shadowColor = "#3b82f6";
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;

            for (const b of bodies) {
                // faint orbit ring
                ctx.beginPath();
                ctx.arc(cx, cy, b.orbitRadius, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                ctx.stroke();

                b.angle += b.speed;
                b.x = cx + Math.cos(b.angle) * b.orbitRadius;
                b.y = cy + Math.sin(b.angle) * b.orbitRadius;

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.dotSize, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            animId = requestAnimationFrame(animate);
        }

        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            let clicked = null;
            for (const b of bodies) {
                const dist = Math.hypot(mx - b.x, my - b.y);
                if (dist < b.dotSize + 4) { clicked = b; break; }
            }

            const panel = document.getElementById("panel");
            if (clicked) {
                panel.innerHTML = `
                    <strong>${clicked.name}</strong>
                    (${clicked.date})<br>
                    Diameter: ${clicked.diameter_m} m &nbsp;|&nbsp;
                    Speed: ${clicked.speed_kph.toLocaleString()} km/h &nbsp;|&nbsp;
                    Miss distance: ${clicked.miss_distance_km.toLocaleString()} km
                    (${clicked.miss_distance_lunar} lunar distances)<br>
                    Hazardous: <span class="${clicked.hazardous ? 'hazardous' : 'safe'}">${clicked.hazardous ? "YES ⚠️" : "No"}</span><br>
                    <a href="${clicked.jpl_url}" target="_blank">View on NASA JPL →</a>
                `;
            }
        });

        fetchAsteroids();
    </script>
</body>
</html>
